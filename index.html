<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Studio</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --accent: #4f7cff;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --border: #2a2f3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .app {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
    }
    textarea, input {
      width: 100%;
      background: #101318;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      font-family: inherit;
    }
    textarea { min-height: 76px; resize: vertical; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.9rem;
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      max-height: 280px;
    }
    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #13161c;
      cursor: pointer;
    }
    .history-item strong { display: block; margin-bottom: 4px; }
    .history-item span { color: var(--muted); font-size: 0.8rem; }
    .status { font-size: 0.88rem; color: var(--muted); min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="app">
    <div>
      <h1>AI Video Studio</h1>
      <p class="subtitle">Version téléphone autonome • Mode démo prêt à l'emploi</p>
    </div>

    <div class="card">
      <label for="prompt">Décris ta vidéo</label>
      <textarea id="prompt">Plan drone au-dessus d'une forêt bretonne au lever du soleil</textarea>

      <label class="row">
        <span>Mode démo sans serveur (vidéo test)</span>
        <input type="checkbox" id="demoMode" checked style="width:auto; transform: scale(1.2);" />
      </label>

      <div id="endpointBox" style="display:none; flex-direction:column; gap:8px;">
        <label for="endpoint">URL API (POST JSON {"prompt": "..."} → {"videoUrl": "..."})</label>
        <input type="url" id="endpoint" placeholder="https://ton-endpoint.example/generate" />
      </div>

      <button id="generateBtn" type="button">Générer la vidéo</button>
      <div id="status" class="status">Prêt</div>
    </div>

    <div class="card" id="playerCard" style="display:none;">
      <strong id="playerTitle">Aperçu</strong>
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="card">
      <strong>Historique</strong>
      <div id="history" style="display:flex; flex-direction:column; gap:8px;">
        <span style="color:var(--muted); font-size:0.85rem;">Aucune vidéo générée pour l'instant.</span>
      </div>
    </div>
  </div>

  <script>
    const DEMO_VIDEO = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
    const promptEl = document.getElementById("prompt");
    const demoModeEl = document.getElementById("demoMode");
    const endpointBoxEl = document.getElementById("endpointBox");
    const endpointEl = document.getElementById("endpoint");
    const btnEl = document.getElementById("generateBtn");
    const statusEl = document.getElementById("status");
    const playerCardEl = document.getElementById("playerCard");
    const playerTitleEl = document.getElementById("playerTitle");
    const videoEl = document.getElementById("videoPlayer");
    const historyEl = document.getElementById("history");

    const items = [];

    demoModeEl.addEventListener("change", () => {
      endpointBoxEl.style.display = demoModeEl.checked ? "none" : "flex";
    });

    function playVideo(item) {
      playerCardEl.style.display = "flex";
      playerTitleEl.textContent = item.prompt;
      videoEl.src = item.url;
      videoEl.play().catch(() => {});
    }

    function renderHistory() {
      if (!items.length) {
        historyEl.innerHTML = '<span style="color:var(--muted); font-size:0.85rem;">Aucune vidéo générée pour l\'instant.</span>';
        return;
      }
      historyEl.innerHTML = "";
      items.forEach((item) => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `<strong>${escapeHtml(item.prompt)}</strong><span>${item.isDemo ? "Démo" : "API"} • Touche pour lire</span>`;
        div.addEventListener("click", () => playVideo(item));
        historyEl.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    btnEl.addEventListener("click", async () => {
      const prompt = promptEl.value.trim();
      if (!prompt) {
        statusEl.textContent = "Écris d'abord une description.";
        return;
      }

      btnEl.disabled = true;
      statusEl.textContent = "Préparation en cours...";

      try {
        let videoUrl = DEMO_VIDEO;
        const isDemo = demoModeEl.checked;

        if (!isDemo) {
          const url = endpointEl.value.trim();
          if (!url) throw new Error("Renseigne une URL d'API ou coche le mode démo.");
          statusEl.textContent = "Appel de l'API...";
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });
          if (!res.ok) throw new Error("Réponse API HTTP " + res.status);
          const data = await res.json();
          videoUrl = data.videoUrl || data.video_url || "";
          if (!videoUrl) throw new Error("Aucune URL vidéo reçue.");
        } else {
          await new Promise((r) => setTimeout(r, 900));
        }

        const item = { prompt, url: videoUrl, isDemo };
        items.unshift(item);
        renderHistory();
        playVideo(item);
        statusEl.textContent = "Vidéo prête.";
      } catch (err) {
        statusEl.textContent = "Erreur : " + (err && err.message ? err.message : "impossible");
      } finally {
        btnEl.disabled = false;
      }
    });
  </script>
</body>
</html>
